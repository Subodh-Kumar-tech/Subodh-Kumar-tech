<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Subodh Kumar - Java Backend Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f89820"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5d6ff"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f89820" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="400" rx="18"/></clipPath>
    <clipPath id="typeclip"><rect class="typing" x="70" y="172" width="440" height="44"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
      .sans { font-family: 'Segoe UI',Inter,Helvetica,Arial,sans-serif; }
      .fade { opacity: 0; animation: fadeIn .6s ease forwards; }
      .d1{animation-delay:.4s}.d2{animation-delay:.9s}.d3{animation-delay:1.4s}.d4{animation-delay:1.9s}
      .d5{animation-delay:2.5s}.d6{animation-delay:3s}.d7{animation-delay:3.5s}.d8{animation-delay:4s}
      .typing { animation: typing 1.6s steps(22) .3s both; }
      .cursor { animation: blink 1s steps(1) infinite; }
      .pulse { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .sweep { animation: sweep 5s linear infinite; }
      .f1 { animation: float 5s ease-in-out infinite; }
      .f2 { animation: float 6s ease-in-out -2s infinite; }
      .f3 { animation: float 7s ease-in-out -4s infinite; }
      @keyframes fadeIn { to { opacity: 1; } }
      @keyframes typing { from { width: 0; } to { width: 440px; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(1.7); } }
      @keyframes sweep { from { transform: translateX(-300px); } to { transform: translateX(1280px); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      .ann{fill:#e3b341}.kw{fill:#ff7b72}.ty{fill:#79c0ff}.cm{fill:#8b949e}.tx{fill:#c9d1d9}.ok{fill:#3fb950}.str{fill:#a5d6ff}.num{fill:#f89820}
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" rx="18" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#dots)" opacity="0.7"/>
    <circle cx="1120" cy="40" r="230" fill="#58a6ff" opacity="0.22" filter="url(#blur)"/>
    <circle cx="120" cy="420" r="220" fill="#f89820" opacity="0.18" filter="url(#blur)"/>
    <rect y="0" width="300" height="3" fill="url(#sweep)" class="sweep"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="18" fill="none" stroke="#30363d"/>

  <!-- Open to work pill -->
  <rect x="70" y="52" width="176" height="30" rx="15" fill="#3fb95018" stroke="#3fb95066"/>
  <circle cx="90" cy="67" r="4.5" fill="#3fb950" class="pulse"/>
  <text x="104" y="72" class="mono" font-size="12" font-weight="700" fill="#3fb950" letter-spacing="1.5">OPEN TO WORK</text>

  <!-- Identity -->
  <text x="70" y="146" class="sans" font-size="68" font-weight="800" fill="url(#nameGrad)">Subodh Kumar</text>
  <g clip-path="url(#typeclip)">
    <text x="70" y="204" class="sans" font-size="31" font-weight="700" fill="url(#accent)">Java Backend Developer</text>
  </g>
  <text x="70" y="240" class="mono" font-size="15" fill="#8b949e">Spring Boot · JWT · PostgreSQL · Concurrency</text>

  <!-- Stats -->
  <g class="sans">
    <text x="70" y="318" font-size="34" font-weight="800" fill="#ffffff">8.41</text>
    <text x="70" y="340" class="mono" font-size="11" fill="#8b949e" letter-spacing="1.5">B.TECH CGPA</text>
    <line x1="190" y1="292" x2="190" y2="344" stroke="#30363d"/>
    <text x="215" y="318" font-size="34" font-weight="800" fill="#ffffff">200+</text>
    <text x="215" y="340" class="mono" font-size="11" fill="#8b949e" letter-spacing="1.5">DSA SOLVED</text>
    <line x1="345" y1="292" x2="345" y2="344" stroke="#30363d"/>
    <text x="370" y="318" font-size="34" font-weight="800" fill="#ffffff">2</text>
    <text x="370" y="340" class="mono" font-size="11" fill="#8b949e" letter-spacing="1.5">BACKEND SYSTEMS</text>
  </g>

  <!-- Floating tech orbs -->
  <g class="mono" font-size="13" font-weight="800" text-anchor="middle">
    <g class="f1"><circle cx="632" cy="96" r="25" fill="#0d1117" stroke="#f89820" stroke-width="2"/><text x="632" y="101" fill="#f89820">Java</text></g>
    <g class="f2"><circle cx="652" cy="206" r="25" fill="#0d1117" stroke="#3fb950" stroke-width="2"/><text x="652" y="211" fill="#3fb950">JWT</text></g>
    <g class="f3"><circle cx="626" cy="316" r="25" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/><text x="626" y="321" fill="#58a6ff">SQL</text></g>
  </g>

  <!-- Card 1: API request -->
  <g filter="url(#shadow)">
    <rect x="700" y="40" width="520" height="176" rx="12" fill="#0d1117" stroke="#30363d"/>
  </g>
  <rect x="700" y="40" width="520" height="34" rx="12" fill="#161b22"/>
  <rect x="700" y="62" width="520" height="12" fill="#161b22"/>
  <circle cx="722" cy="57" r="5.5" fill="#ff5f56"/><circle cx="741" cy="57" r="5.5" fill="#ffbd2e"/><circle cx="760" cy="57" r="5.5" fill="#27c93f"/>
  <text x="960" y="61" class="mono cm" font-size="12" text-anchor="middle">POST /api/v1/transfers</text>
  <g class="mono" font-size="14">
    <text x="722" y="102" class="fade d1"><tspan class="ok" font-weight="700">POST</tspan><tspan class="tx"> /api/v1/transfers</tspan></text>
    <text x="722" y="128" class="fade d2"><tspan class="ty">Authorization:</tspan><tspan class="str"> Bearer eyJhbGciOiJIUzI1…</tspan></text>
    <text x="722" y="154" class="fade d3"><tspan class="tx">{ </tspan><tspan class="ty">"from"</tspan><tspan class="tx">: </tspan><tspan class="num">101</tspan><tspan class="tx">, </tspan><tspan class="ty">"to"</tspan><tspan class="tx">: </tspan><tspan class="num">202</tspan><tspan class="tx">, </tspan><tspan class="ty">"amount"</tspan><tspan class="tx">: </tspan><tspan class="num">250.00</tspan><tspan class="tx"> }</tspan></text>
    <text x="722" y="192" class="fade d4"><tspan class="ok" font-weight="700">← 200 OK</tspan><tspan class="tx">  { </tspan><tspan class="ty">"status"</tspan><tspan class="tx">: </tspan><tspan class="str">"COMMITTED"</tspan><tspan class="tx"> }</tspan></text>
  </g>

  <!-- Card 2: tests -->
  <g filter="url(#shadow)">
    <rect x="700" y="234" width="520" height="130" rx="12" fill="#0d1117" stroke="#30363d"/>
  </g>
  <rect x="700" y="234" width="520" height="34" rx="12" fill="#161b22"/>
  <rect x="700" y="256" width="520" height="12" fill="#161b22"/>
  <circle cx="722" cy="251" r="5.5" fill="#ff5f56"/><circle cx="741" cy="251" r="5.5" fill="#ffbd2e"/><circle cx="760" cy="251" r="5.5" fill="#27c93f"/>
  <text x="960" y="255" class="mono cm" font-size="12" text-anchor="middle">terminal</text>
  <g class="mono" font-size="14">
    <text x="722" y="296" class="fade d5"><tspan class="ok">$</tspan><tspan class="tx"> mvn test</tspan></text>
    <text x="722" y="322" class="fade d6"><tspan class="cm">[INFO]</tspan><tspan class="tx"> JUnit 5 + Mockito ........ </tspan><tspan class="ok">PASSED ✔</tspan></text>
    <text x="722" y="348" class="fade d7"><tspan class="cm">[INFO]</tspan><tspan class="ok" font-weight="700"> BUILD SUCCESS</tspan><tspan class="tx">  </tspan><tspan class="cursor tx">▌</tspan></text>
  </g>
</svg>
